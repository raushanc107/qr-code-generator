name: Deploy Angular QR Generator to GitHub Pages

on:
  push:
    branches:
      - main   # Triggers on every push to main branch
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build -- --base-href /qr-code-generator/
        # Replace 'qr-code-generator' with your actual GitHub repository name

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/qr-code-generator/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
